name: Auto-Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build APK on EAS Cloud
        run: eas build --platform android --profile production --non-interactive --wait

      - name: 📥 Download APK from EAS
        run: |
          BUILD_URL=$(eas build:list --platform android --status finished --limit 1 --json | jq -r '.[0].artifacts.buildUrl')
          echo "Downloading APK from $BUILD_URL"
          wget "$BUILD_URL" -O CraxNet.apk

      - name: 🚀 Upload to CraxReleases Repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release upload latest CraxNet.apk --repo notreallyrajat/CraxReleases --clobber
